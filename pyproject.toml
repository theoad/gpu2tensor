[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu2tensor"
version = "0.1.0"
description = "Accelerator measurements for learning from and evaluating kernels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/theoad/gpu2tensor"
Issues = "https://github.com/theoad/gpu2tensor/issues"

[project.optional-dependencies]
learning = ["torch>=2.2"]
gym = ["gymnasium>=1.0"]
test = ["pytest>=8"]

[project.scripts]
gpu2tensor-worker = "gpu2tensor.worker:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["gpu2tensor*"]
exclude = ["gpu2tensor.dev*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
